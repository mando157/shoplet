<!-- 

? Directives
  * Structural Directive
    & *ngIf 
    & *ngFor 
    & *ngSwitch

  * Attribute Directive
    & nbClass -> Add / Remove CSS Classes Dynamically -> [ngClass]="{'class': true}"
    & nbStyle -> Add / Remove inline Style -> [ngStyle]="{'property': expression}"
    & nbModel -> Two Way Binding in forms [()] banana in a box -> [(ngModel)]="name"
  
  * Creating Directive
    & ng generate directive directives/testDirective --skip-tests
    & ng g d directives/testDirective --skip-tests

  * input() signal -> Parent Send Data To Child (Read Only Signal)
  * Output() signal -> Child Send Data To Parent (Read Only Signal)
  * model() signal -> two way data binding [()] (writeable signal) 

  * Access child from parent (viewChildren() -> array , viewChild<componentType>(componentName) -> viewChild<Navbar>(child1) "child1 -> #child1 in tag")

  * We can make a General Object by service or make a function common in any component (by injection)

-->
