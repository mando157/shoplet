<div class="card">
    <div class="image card-img-top">
        <img src="{{product().img}}" class="w-100" alt="product">

        @if(product().price < 600){ <span class="badge text-bg-success">Best Price</span>
            }
    </div>

    <div class="card-body">
        <h5 class="card-title name">{{product().name}}</h5>
        <p class="description">{{product().description}}</p>
        <span class="price">{{product().price | currency}}</span>
        <button class="add-to-cart" (click)="cartProductService.addProductToCart(product())">Add Product</button>
    </div>
</div>
